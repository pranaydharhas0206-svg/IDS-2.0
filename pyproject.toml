[project]
name = "drone-forensics-toolkit"
version = "0.1.0"
description = "Indigenous drone forensic acquisition, analysis, and reporting toolkit (PUSHPAK Grand Challenge 3 - Objective 1)"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.41",
    "pyulog>=1.0",
    "Jinja2>=3.1",
    "simplekml>=1.3",
    "xhtml2pdf>=0.2.17",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
toolkit = "toolkit.cli:main"
ids = "ids.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["toolkit*", "ids*"]
